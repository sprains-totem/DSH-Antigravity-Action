# Cordis patch layer for DSH web profile
- insert:
    - id: fail-soft
      name: dsh-fail-soft

    - id: dsh-mobile-nav
      name: "@dsh-external/dsh-mobile-nav"

    - id: llm-antigravity
      name: dsh-llm-antigravity
      config:
        refreshTokenEnv: ANTIGRAVITY_REFRESH_TOKEN

    - id: web-search-antigravity
      name: dsh-web-search-antigravity
      config:
        refreshTokenEnv: ANTIGRAVITY_REFRESH_TOKEN

    - id: web-search-selector
      name: dsh-web-search-selector

    - id: image-gen-antigravity
      name: dsh-image-gen-antigravity
      config:
        refreshTokenEnv: ANTIGRAVITY_REFRESH_TOKEN

    - id: cloudflare-tunnel
      name: dsh-cloudflare-tunnel
      config:
        enabled: true
        port: 3080

- id: web
  config:
    searchProvider: deepseek-official
