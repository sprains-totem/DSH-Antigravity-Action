name: DeepSeek Harness Server (Direct Native 3080 & Fully Unlocked)

on:
  workflow_dispatch:
    inputs:
      refresh_token:
        description: 'Antigravity OAuth Refresh Token'
        required: false
        type: string
  push:
    branches:
      - main
      - master

permissions:
  contents: write
  actions: write
  checks: write

jobs:
  dsh-server:
    name: Run DeepSeek Harness (Antigravity Suite & Direct Native Cloudflare Tunnel)
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install System Tools & Global DSH
        run: |
          sudo apt-get update && sudo apt-get install -y tmate curl
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          rm cloudflared.deb
          sudo npm install -g @deepseek-ai/dsh
          # 赋予 runner 用户对全局 node_modules 的完全读写权限
          sudo chown -R $(whoami) /usr/local/lib/node_modules

      - name: Setup DSH Profile, Plugins & Full Restriction Lifting
        run: |
          mkdir -p ~/.dsh/profiles/web/plugins ~/.dsh/profiles/web/node_modules

          # 部署全部已在本地完整测试验证的 Antigravity 插件套件
          cp -r plugins/* ~/.dsh/profiles/web/plugins/
          cp -r plugins/* ~/.dsh/profiles/web/node_modules/

          # 写入 web profile 的 cordis.patch.yml
          cp cordis.patch.yml ~/.dsh/profiles/web/cordis.patch.yml
          cp cordis.patch.yml ~/.dsh/cordis.patch.yml

          # 执行全局深度解禁
          node unlock-dsh.mjs

          REFRESH_TOKEN="${{ inputs.refresh_token || secrets.ANTIGRAVITY_REFRESH_TOKEN }}"
          if [ -n "$REFRESH_TOKEN" ]; then
            mkdir -p ~/.dsh
            cat <<EOF > ~/.dsh/.credentials.yaml
          ANTIGRAVITY_REFRESH_TOKEN: "$REFRESH_TOKEN"
          EOF
            echo "ANTIGRAVITY_REFRESH_TOKEN=$REFRESH_TOKEN" >> $GITHUB_ENV
            echo "Configured ANTIGRAVITY_REFRESH_TOKEN credential."
          fi

      - name: Launch DeepSeek Harness Server (Direct Native 3080 & Cloudflare Tunnel)
        run: |
          echo "1. Starting Cloudflare Tunnel on port 3080..."
          cloudflared tunnel --url http://127.0.0.1:3080 --no-autoupdate > /tmp/cloudflared.log 2>&1 &

          echo "2. Waiting for Cloudflare Tunnel URL..."
          TUNNEL_URL=""
          for i in $(seq 1 30); do
            TUNNEL_URL=$(grep -o 'https://[-a-zA-Z0-9]*\.trycloudflare\.com' /tmp/cloudflared.log | head -n 1 || true)
            if [ -n "$TUNNEL_URL" ]; then
              break
            fi
            sleep 1
          done

          echo ""
          echo "=========================================================================="
          if [ -n "$TUNNEL_URL" ]; then
            echo "🎉🎉🎉 DEEPSEEK HARNESS LIVE URL: $TUNNEL_URL 🎉🎉🎉"
            echo ""
            echo "## 🌐 DeepSeek Harness Live URL" >> $GITHUB_STEP_SUMMARY
            echo "### 👉 **Public URL**: [$TUNNEL_URL]($TUNNEL_URL)" >> $GITHUB_STEP_SUMMARY
            echo "- **Status**: Online & Fully Unlocked" >> $GITHUB_STEP_SUMMARY
            echo "- **Port**: 3080" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Cloudflare tunnel URL not found in log yet, raw log:"
            cat /tmp/cloudflared.log || true
          fi
          echo "=========================================================================="
          echo ""

          echo "3. Starting DeepSeek Harness on native port 3080..."
          dsh web --port 3080
