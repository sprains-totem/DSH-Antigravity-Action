name: DeepSeek Harness Server (A/B Self-Healing & Mobile Ready)

on:
  workflow_dispatch:
    inputs:
      refresh_token:
        description: 'Antigravity OAuth Refresh Token'
        required: false
        type: string
  push:
    branches:
      - main
      - master

permissions:
  contents: write
  actions: write
  checks: write

jobs:
  dsh-server:
    name: Run DeepSeek Harness Server (Decoupled Launcher)
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 解耦架构：工作流结构永久固定，所有具体安装、A/B 槽自愈与启动逻辑由 start.sh 驱动
      - name: Launch DSH via Decoupled Lifecycle Manager
        env:
          INPUT_REFRESH_TOKEN: ${{ inputs.refresh_token }}
          ANTIGRAVITY_REFRESH_TOKEN: ${{ secrets.ANTIGRAVITY_REFRESH_TOKEN }}
          CF_WORKER_URL: ${{ secrets.CF_WORKER_URL }}
          CF_WORKER_TOKEN: ${{ secrets.CF_WORKER_TOKEN || secrets.CLOUDFLARE_WORKER_API }}
        run: |
          chmod +x ./start.sh
          ./start.sh
